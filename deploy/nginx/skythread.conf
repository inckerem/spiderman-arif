# SKYTHREAD behind Nginx on a subdomain (example: oyun.example.com).
# Replace oyun.example.com everywhere (also ALLOWED_ORIGINS in docker-compose.yml),
# copy to /etc/nginx/sites-available/ (or conf.d/), enable, then:
#   sudo nginx -t && sudo systemctl reload nginx
# TLS ends here; the game container listens on 127.0.0.1:8080 only.
# Certificates: e.g. `sudo certbot certonly --webroot -w /var/www/certbot -d oyun.example.com`.

# WebSocket upgrade: "Connection: upgrade" only when the client asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream skythread {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name oyun.example.com;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # Nginx >= 1.25.1; on older versions use "listen 443 ssl http2;" instead
    server_name oyun.example.com;

    ssl_certificate     /etc/letsencrypt/live/oyun.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oyun.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:skythread_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Multiplayer WebSocket. Long timeouts: a room connection stays open for the
    # whole session (the server pings every 20 s, so idle sockets stay alive).
    location /ws {
        proxy_pass http://skythread;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The game files and /healthz.
    location / {
        proxy_pass http://skythread;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
